<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Registration Form</title>
  <link rel="stylesheet" href="registration.css">
</head>
<body>

  <div class="form-wrapper">
    <h2>Student Registration Form</h2>
    
    <form>
      <!-- Single Input Field Groups -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Enter your name" required>
        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="Enter your email" required>
        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Enter your password" required>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">
      </div>

      <!-- Gender -->
      <div class="form-group">
        <label>Gender:</label>
        <div class="flex-options">
          <label><input type="radio" name="gender" value="male"> Male</label>
          <label><input type="radio" name="gender" value="female"> Female</label>
        </div>
      </div>

      <!-- Languages -->
      <div class="form-group">
        <label>Favorite Programming Language:</label>
        <div class="flex-options">
          <label><input type="checkbox" name="lang" value="CSS"> CSS</label>
          <label><input type="checkbox" name="lang" value="JS"> JavaScript</label>
          <label><input type="checkbox" name="lang" value="HTML"> HTML</label>
        </div>
      </div>

      <div class="form-group">
        <label for="city">City:</label>
        <select id="city">
          <option value="Lahore">Lahore</option>
          <option value="Karachi">Karachi</option>
          <option value="Islamabad">Islamabad</option>
        </select>
      </div>

      <div class="form-group">
        <label for="about">About Yourself:</label>
        <textarea id="about" rows="4" placeholder="Tell us about yourself..."></textarea>
      </div>

      <!-- Buttons -->
      <div class="button-group">
        <button type="submit" class="btn btn-submit">Submit</button>
        <button type="reset" class="btn btn-reset">Reset</button>
      </div>
    </form>
  </div>

</body>
</html>
