<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Simple Web Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="calculator">
    <!-- Expression screen showing numbers and operator -->
    <div id="display" class="display">0</div>

    <div class="buttons">
      <button onclick="clearDisplay()" class="btn btn-clear">Clear</button>
      <button onclick="setOperator('/')" class="btn btn-op">&divide;</button>
      <button onclick="setOperator('x')" class="btn btn-op">&times;</button>
      <button onclick="setOperator('-')" class="btn btn-op">&minus;</button>

      <button onclick="appendNumber('7')" class="btn">7</button>
      <button onclick="appendNumber('8')" class="btn">8</button>
      <button onclick="appendNumber('9')" class="btn">9</button>
      <button onclick="setOperator('+')" class="btn btn-op">+</button>

      <button onclick="appendNumber('4')" class="btn">4</button>
      <button onclick="appendNumber('5')" class="btn">5</button>
      <button onclick="appendNumber('6')" class="btn">6</button>
      <button onclick="calculate()" class="btn btn-equals">=</button>

      <button onclick="appendNumber('1')" class="btn">1</button>
      <button onclick="appendNumber('2')" class="btn">2</button>
      <button onclick="appendNumber('3')" class="btn">3</button>
      <button onclick="appendNumber('0')" class="btn btn-zero">0</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
